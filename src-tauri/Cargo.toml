[package]
name = "spotify-rust"
version = "0.1.0"
license = "MIT"
edition = "2021"
[lib]
name = "spotify_rust"
crate-type = ["rlib"]
[[bin]]
name = "spotify-rust"
path = "src/main.rs"
required-features = ["desktop"]
[[bin]]
name = "player-probe"
path = "src/bin/player-probe.rs"
required-features = ["desktop"]
[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:keyring", "dep:tauri-plugin-global-shortcut", "dep:souvlaki", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-autostart"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tauri = { version = "2", optional = true, features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Windows media controls (media keys, volume flyout, lock screen). Not on Linux:
# its MPRIS backend needs libdbus.
souvlaki = { version = "0.9", default-features = false, optional = true }
[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

