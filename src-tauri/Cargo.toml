[package]
name = "spotify-rust"
version = "0.1.0"
edition = "2021"
[lib]
name = "spotify_rust"
crate-type = ["rlib"]
[[bin]]
name = "spotify-rust"
path = "src/main.rs"
required-features = ["desktop"]
[[bin]]
name = "player-probe"
path = "src/bin/player-probe.rs"
required-features = ["desktop"]
[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:keyring"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tauri = { version = "2", optional = true, features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

